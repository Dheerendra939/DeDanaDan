<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Online Chess - Fullscreen</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Chess.js for game logic and rule validation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        .piece {
            font-size: clamp(2rem, 9.5vw, 4.5rem);
            cursor: pointer;
            user-select: none;
            transition: transform 0.08s ease;
        }
        .piece:hover {
            transform: scale(1.12);
        }
        .square {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 12.5%;
            aspect-ratio: 1;
            box-sizing: border-box;
        }
        .light { background-color: #f0d9b5; }
        .dark { background-color: #b58863; }
        .selected { background-color: #7b61ff !important; }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-between p-2 sm:p-4 select-none">

    <!-- Top Header / Status bar -->
    <div class="w-full max-w-lg flex flex-col gap-1 px-1">
        <div class="flex justify-between items-center">
            <h1 class="text-lg sm:text-xl font-bold tracking-tight">Live Chess</h1>
            <div class="bg-slate-800 px-2.5 py-1 rounded-md text-xs sm:text-sm text-slate-200 border border-slate-700">
                DB Pings: <span id="pingCount" class="font-bold text-amber-400">0</span>
            </div>
        </div>
        <div class="flex justify-between items-center text-xs sm:text-sm">
            <span id="status" class="font-semibold text-emerald-400">Ready to play</span>
            <span class="text-slate-400 text-xs">Share link to play</span>
        </div>
    </div>

    <!-- Chessboard Container (Fit screen, full width, perfectly square) -->
    <div class="w-full max-w-[min(92vw,520px)] aspect-square flex flex-wrap rounded-xl overflow-hidden border-4 border-slate-800 shadow-2xl my-2" id="board"></div>

    <!-- Bottom Controls -->
    <div class="w-full max-w-lg flex justify-between items-center px-1 pb-1">
        <p class="text-xs text-slate-400">Moves sync automatically.</p>
        <button id="restartBtn" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition cursor-pointer shadow-lg active:scale-95">
            Restart Game
        </button>
    </div>

    <!-- Firebase Firestore & Game Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Your Firebase Configuration
        const firebaseConfig = {
          apiKey: "AIzaSyAjqIzlrb9aq8qtEtYFA9GbDZeiydVvbz4",
          authDomain: "git9-43302.firebaseapp.com",
          databaseURL: "https://git9-43302-default-rtdb.firebaseio.com",
          projectId: "git9-43302",
          storageBucket: "git9-43302.firebasestorage.app",
          messagingSenderId: "724237457030",
          appId: "1:724237457030:web:a65c2756f1aa13503aa307",
          measurementId: "G-W8Q9T9KRP1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        // Firestore Document Reference
        const gameDocRef = doc(db, "chess_matches", "room_1");

        const chess = new Chess();
        let selectedSquare = null;
        let currentTouchCount = 0;
        let isLocallyMoving = false;

        const boardElement = document.getElementById('board');
        const statusElement = document.getElementById('status');
        const pingCountElement = document.getElementById('pingCount');

        // Unicode chess symbols mapping
        const unicodePieces = {
            p: '♟', r: '♜', n: '♞', b: '♝', q: '♛', k: '♚',
            P: '♙', R: '♖', N: '♘', B: '♗', Q: '♕', K: '♔'
        };

        // Render the board instantly on UI
        function renderBoard() {
            boardElement.innerHTML = '';
            const board = chess.board();

            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const squareId = String.fromCharCode(97 + c) + (8 - r);
                    const squareDiv = document.createElement('div');
                    squareDiv.className = `square ${(r + c) % 2 === 0 ? 'light' : 'dark'}`;
                    squareDiv.dataset.square = squareId;

                    const piece = board[r][c];
                    if (piece) {
                        const pieceSpan = document.createElement('span');
                        pieceSpan.className = 'piece';
                        pieceSpan.textContent = unicodePieces[piece.color === 'w' ? piece.type.toUpperCase() : piece.type];
                        squareDiv.appendChild(pieceSpan);
                    }

                    if (selectedSquare === squareId) {
                        squareDiv.classList.add('selected');
                    }

                    squareDiv.addEventListener('click', () => handleSquareClick(squareId));
                    boardElement.appendChild(squareDiv);
                }
            }
            updateStatus();
        }

        // Update status text
        function updateStatus() {
            let status = '';
            let moveColor = chess.turn() === 'w' ? 'White' : 'Black';

            if (chess.in_checkmate()) {
                status = `Checkmate! ${moveColor === 'White' ? 'Black' : 'White'} wins!`;
            } else if (chess.in_draw()) {
                status = 'Game Over, Drawn!';
            } else {
                status = `${moveColor}'s turn`;
                if (chess.in_check()) {
                    status += ` (${moveColor} in CHECK!)`;
                }
            }
            statusElement.textContent = status;
        }

        // Handle square selection & moves instantly
        async function handleSquareClick(square) {
            if (selectedSquare === null) {
                const piece = chess.get(square);
                if (piece && piece.color === chess.turn()) {
                    selectedSquare = square;
                    renderBoard();
                }
            } else {
                const move = chess.move({
                    from: selectedSquare,
                    to: square,
                    promotion: 'q'
                });

                selectedSquare = null;

                if (move) {
                    renderBoard();

                    try {
                        isLocallyMoving = true;
                        currentTouchCount++;
                        
                        await setDoc(gameDocRef, {
                            fen: chess.fen(),
                            lastUpdated: Date.now(),
                            touchCount: currentTouchCount
                        });
                        
                        pingCountElement.textContent = currentTouchCount;
                    } catch (error) {
                        console.error("Error writing move to Firestore:", error);
                        alert("Failed to sync move to database.");
                    } finally {
                        setTimeout(() => { isLocallyMoving = false; }, 300);
                    }
                } else {
                    const piece = chess.get(square);
                    if (piece && piece.color === chess.turn()) {
                        selectedSquare = square;
                    }
                    renderBoard();
                }
            }
        }

        // Initialize Firestore connection & smooth listener
        async function initFirestore() {
            try {
                const docSnap = await getDoc(gameDocRef);
                
                if (!docSnap.exists()) {
                    await setDoc(gameDocRef, {
                        fen: chess.fen(),
                        lastUpdated: Date.now(),
                        touchCount: 1
                    });
                }

                onSnapshot(gameDocRef, (docSnapshot) => {
                    if (docSnapshot.exists() && !isLocallyMoving) {
                        const data = docSnapshot.data();
                        
                        if (data.touchCount !== undefined) {
                            currentTouchCount = data.touchCount;
                            pingCountElement.textContent = currentTouchCount;
                        }

                        if (data.fen && data.fen !== chess.fen()) {
                            chess.load(data.fen);
                            selectedSquare = null;
                            renderBoard();
                        }
                    }
                }, (error) => {
                    console.error("Firestore subscription error:", error);
                    statusElement.textContent = "Sync error (Check rules)";
                    statusElement.className = "font-semibold text-red-400";
                });

            } catch (err) {
                console.error("Initialization error:", err);
                statusElement.textContent = "Offline mode";
                statusElement.className = "font-semibold text-amber-400";
            }
        }

        // Restart button handler
        document.getElementById('restartBtn').addEventListener('click', async () => {
            if (confirm("Are you sure you want to restart the game?")) {
                chess.reset();
                selectedSquare = null;
                renderBoard();
                
                try {
                    isLocallyMoving = true;
                    currentTouchCount++;
                    await setDoc(gameDocRef, {
                        fen: chess.fen(),
                        lastUpdated: Date.now(),
                        touchCount: currentTouchCount
                    });
                    pingCountElement.textContent = currentTouchCount;
                } catch (error) {
                    console.error("Error resetting game:", error);
                } finally {
                    setTimeout(() => { isLocallyMoving = false; }, 300);
                }
            }
        });

        // Initial render & connection
        renderBoard();
        initFirestore();
    </script>
</body>
</html>

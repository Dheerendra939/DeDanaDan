<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Online Chess</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Chess.js for game logic and rule validation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        .piece {
            font-size: clamp(2rem, 9.5vw, 4.5rem);
            cursor: pointer;
            user-select: none;
            transition: transform 0.08s ease;
            line-height: 1;
        }
        .piece:hover {
            transform: scale(1.12);
        }
        /* Fully filled bright solid white pieces with a strong shadow for contrast */
        .piece-w {
            color: #ffffff !important;
            text-shadow: 0 0 3px rgba(0, 0, 0, 0.9), 0 1px 2px rgba(0, 0, 0, 0.7);
            filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.5));
        }
        /* Solid filled black pieces */
        .piece-b {
            color: #000000 !important;
            filter: drop-shadow(0 1px 2px rgba(255, 255, 255, 0.4));
        }
        /* Maximized square board layout filling screen width/height cleanly */
        #board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: 100vw;
            max-width: min(98vw, 90vh);
            aspect-ratio: 1 / 1;
        }
        .square {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            user-select: none;
        }
        .light { background-color: #f0d9b5; }
        .dark { background-color: #b58863; }
        .selected { background-color: #7b61ff !important; }
    </style>
</head>
<body class="bg-slate-950 text-white h-screen flex flex-col items-center justify-between py-2 px-1 select-none overflow-hidden">

    <!-- Top Header with Status and Restart Button -->
    <div class="w-full max-w-[min(98vw,90vh)] flex flex-col gap-1 px-1">
        <div class="flex justify-between items-center">
            <h1 class="text-base sm:text-xl font-bold tracking-tight">Live Chess</h1>
            <button id="restartBtn" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1 rounded-md text-xs sm:text-sm font-medium transition cursor-pointer shadow-md active:scale-95">
                Restart Game
            </button>
        </div>
        <div class="flex justify-between items-center">
            <span id="status" class="text-xs sm:text-sm font-semibold text-emerald-400">Ready to play</span>
            <span class="text-[11px] text-slate-400">Share link to play live</span>
        </div>
    </div>

    <!-- Chessboard Container (Edge-to-edge max fit) -->
    <div id="board" class="rounded-lg overflow-hidden border-2 border-slate-800 shadow-2xl my-auto"></div>

    <!-- Bottom minimalist footer -->
    <div class="w-full max-w-[min(98vw,90vh)] text-center pb-1">
        <p class="text-[11px] text-slate-500">Moves sync live automatically via Firestore.</p>
    </div>

    <!-- Firebase Firestore & Game Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Your Firebase Configuration
        const firebaseConfig = {
          apiKey: "AIzaSyAjqIzlrb9aq8qtEtYFA9GbDZeiydVvbz4",
          authDomain: "git9-43302.firebaseapp.com",
          databaseURL: "https://git9-43302-default-rtdb.firebaseio.com",
          projectId: "git9-43302",
          storageBucket: "git9-43302.firebasestorage.app",
          messagingSenderId: "724237457030",
          appId: "1:724237457030:web:a65c2756f1aa13503aa307",
          measurementId: "G-W8Q9T9KRP1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        const gameDocRef = doc(db, "chess_matches", "room_1");

        const chess = new Chess();
        let selectedSquare = null;
        let isLocallyMoving = false;

        const boardElement = document.getElementById('board');
        const statusElement = document.getElementById('status');

        const unicodePieces = {
            p: '♟', r: '♜', n: '♞', b: '♝', q: '♛', k: '♚',
            P: '♙', R: '♖', N: '♘', B: '♗', Q: '♕', K: '♔'
        };

        function renderBoard() {
            boardElement.innerHTML = '';
            const board = chess.board();

            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const squareId = String.fromCharCode(97 + c) + (8 - r);
                    const squareDiv = document.createElement('div');
                    squareDiv.className = `square ${(r + c) % 2 === 0 ? 'light' : 'dark'}`;
                    squareDiv.dataset.square = squareId;

                    const piece = board[r][c];
                    if (piece) {
                        const pieceSpan = document.createElement('span');
                        const colorClass = piece.color === 'w' ? 'piece-w' : 'piece-b';
                        pieceSpan.className = `piece ${colorClass}`;
                        pieceSpan.textContent = unicodePieces[piece.color === 'w' ? piece.type.toUpperCase() : piece.type];
                        squareDiv.appendChild(pieceSpan);
                    }

                    if (selectedSquare === squareId) {
                        squareDiv.classList.add('selected');
                    }

                    squareDiv.addEventListener('click', () => handleSquareClick(squareId));
                    boardElement.appendChild(squareDiv);
                }
            }
            updateStatus();
        }

        function updateStatus() {
            let status = '';
            let moveColor = chess.turn() === 'w' ? 'White' : 'Black';

            if (chess.in_checkmate()) {
                status = `Checkmate! ${moveColor === 'White' ? 'Black' : 'White'} wins!`;
            } else if (chess.in_draw()) {
                status = 'Game Over, Drawn!';
            } else {
                status = `${moveColor}'s turn`;
                if (chess.in_check()) {
                    status += ` (${moveColor} in CHECK!)`;
                }
            }
            statusElement.textContent = status;
        }

        async function handleSquareClick(square) {
            if (selectedSquare === null) {
                const piece = chess.get(square);
                if (piece && piece.color === chess.turn()) {
                    selectedSquare = square;
                    renderBoard();
                }
            } else {
                const move = chess.move({
                    from: selectedSquare,
                    to: square,
                    promotion: 'q'
                });

                selectedSquare = null;

                if (move) {
                    renderBoard();

                    try {
                        isLocallyMoving = true;
                        await setDoc(gameDocRef, {
                            fen: chess.fen(),
                            lastUpdated: Date.now()
                        });
                    } catch (error) {
                        console.error("Error writing move to Firestore:", error);
                    } finally {
                        setTimeout(() => { isLocallyMoving = false; }, 300);
                    }
                } else {
                    const piece = chess.get(square);
                    if (piece && piece.color === chess.turn()) {
                        selectedSquare = square;
                    }
                    renderBoard();
                }
            }
        }

        async function initFirestore() {
            try {
                const docSnap = await getDoc(gameDocRef);
                
                if (!docSnap.exists()) {
                    await setDoc(gameDocRef, {
                        fen: chess.fen(),
                        lastUpdated: Date.now()
                    });
                }

                onSnapshot(gameDocRef, (docSnapshot) => {
                    if (docSnapshot.exists() && !isLocallyMoving) {
                        const data = docSnapshot.data();
                        if (data.fen && data.fen !== chess.fen()) {
                            chess.load(data.fen);
                            selectedSquare = null;
                            renderBoard();
                        }
                    }
                });
            } catch (err) {
                console.error("Initialization error:", err);
            }
        }

        document.getElementById('restartBtn').addEventListener('click', async () => {
            if (confirm("Are you sure you want to restart the game?")) {
                chess.reset();
                selectedSquare = null;
                renderBoard();
                
                try {
                    isLocallyMoving = true;
                    await setDoc(gameDocRef, {
                        fen: chess.fen(),
                        lastUpdated: Date.now()
                    });
                } catch (error) {
                    console.error("Error resetting game:", error);
                } finally {
                    setTimeout(() => { isLocallyMoving = false; }, 300);
                }
            }
        });

        renderBoard();
        initFirestore();
    </script>
</body>
</html>

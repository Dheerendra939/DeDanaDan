<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Chess Match</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Chess.js for game logic and rule validation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        .piece {
            font-size: 2.75rem;
            cursor: pointer;
            user-select: none;
            transition: transform 0.1s ease;
        }
        .piece:hover {
            transform: scale(1.1);
        }
        .square {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 12.5%;
            aspect-ratio: 1;
        }
        .light { background-color: #f0d9b5; }
        .dark { background-color: #b58863; }
        .selected { background-color: #7b61ff !important; }
        .highlight { background-color: #81b64c !important; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-800 rounded-xl shadow-2xl p-6 border border-slate-700">
        <h1 class="text-2xl font-bold text-center mb-2">Live Online Chess</h1>
        
        <!-- Status & Room Info -->
        <div class="flex justify-between items-center mb-4 text-sm text-slate-300">
            <span id="status" class="font-semibold text-emerald-400">Connecting to game...</span>
            <button id="restartBtn" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded font-medium transition cursor-pointer">
                Restart Game
            </button>
        </div>

        <!-- Chessboard Container -->
        <div id="board" class="w-full aspect-square flex flex-wrap rounded-lg overflow-hidden border-4 border-slate-700 shadow-inner"></div>

        <!-- Instructions -->
        <p class="text-xs text-slate-400 text-center mt-4">
            Share this page URL with your friend. Moves sync live instantly!
        </p>
    </div>

    <!-- Firebase & Game Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Your Firebase Configuration
        const firebaseConfig = {
          apiKey: "AIzaSyAjqIzlrb9aq8qtEtYFA9GbDZeiydVvbz4",
          authDomain: "git9-43302.firebaseapp.com",
          databaseURL: "https://git9-43302-default-rtdb.firebaseio.com",
          projectId: "git9-43302",
          storageBucket: "git9-43302.firebasestorage.app",
          messagingSenderId: "724237457030",
          appId: "1:724237457030:web:a65c2756f1aa13503aa307",
          measurementId: "G-W8Q9T9KRP1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const gameRef = ref(db, 'chess_matches/room_1');

        const chess = new Chess();
        let selectedSquare = null;
        let boardElement = document.getElementById('board');
        let statusElement = document.getElementById('status');

        // Unicode chess symbols mapping
        const unicodePieces = {
            p: '♟', r: '♜', n: '♞', b: '♝', q: '♛', k: '♚',
            P: '♙', R: '♖', N: '♘', B: '♗', Q: '♕', K: '♔'
        };

        // Render the board on the UI
        function renderBoard() {
            boardElement.innerHTML = '';
            const board = chess.board();

            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const squareId = String.fromCharCode(97 + c) + (8 - r);
                    const squareDiv = document.createElement('div');
                    squareDiv.className = `square ${(r + c) % 2 === 0 ? 'light' : 'dark'}`;
                    squareDiv.dataset.square = squareId;

                    const piece = board[r][c];
                    if (piece) {
                        const pieceSpan = document.createElement('span');
                        pieceSpan.className = 'piece';
                        pieceSpan.textContent = unicodePieces[piece.color === 'w' ? piece.type.toUpperCase() : piece.type];
                        squareDiv.appendChild(pieceSpan);
                    }

                    if (selectedSquare === squareId) {
                        squareDiv.classList.add('selected');
                    }

                    squareDiv.addEventListener('click', () => handleSquareClick(squareId));
                    boardElement.appendChild(squareDiv);
                }
            }
            updateStatus();
        }

        // Update status text
        function updateStatus() {
            let status = '';
            let moveColor = chess.turn() === 'w' ? 'White' : 'Black';

            if (chess.in_checkmate()) {
                status = `Game Over, ${moveColor} is in checkmate!`;
            } else if (chess.in_draw()) {
                status = 'Game Over, Drawn!';
            } else {
                status = `${moveColor}'s turn`;
                if (chess.in_check()) {
                    status += ` (${moveColor} is in CHECK!)`;
                }
            }
            statusElement.textContent = status;
        }

        // Handle square selection & moves
        function handleSquareClick(square) {
            if (selectedSquare === null) {
                const piece = chess.get(square);
                if (piece && piece.color === chess.turn()) {
                    selectedSquare = square;
                    renderBoard();
                }
            } else {
                const move = chess.move({
                    from: selectedSquare,
                    to: square,
                    promotion: 'q' // auto promote to queen for simplicity
                });

                selectedSquare = null;

                if (move) {
                    // Push the new FEN state to Firebase
                    set(gameRef, {
                        fen: chess.fen(),
                        lastUpdated: Date.now()
                    });
                } else {
                    // If invalid move, check if user clicked another own piece to switch selection
                    const piece = chess.get(square);
                    if (piece && piece.color === chess.turn()) {
                        selectedSquare = square;
                    }
                }
                renderBoard();
            }
        }

        // Listen for live changes from Firebase
        onValue(gameRef, (snapshot) => {
            const data = snapshot.val();
            if (data && data.fen) {
                if (data.fen !== chess.fen()) {
                    chess.load(data.fen);
                    selectedSquare = null;
                    renderBoard();
                }
            } else {
                // Initialize room if empty
                set(gameRef, { fen: chess.fen(), lastUpdated: Date.now() });
            }
        });

        // Restart button handler
        document.getElementById('restartBtn').addEventListener('click', () => {
            if (confirm("Are you sure you want to restart the game?")) {
                chess.reset();
                set(gameRef, {
                    fen: chess.fen(),
                    lastUpdated: Date.now()
                });
            }
        });
    </script>
</body>
</html>
